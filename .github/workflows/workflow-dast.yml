name: DAST API OWASP ZAP S14
on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artefacto que contiene el JAR ya verificado por integración.
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparar:
    name: Empaquetar aplicación para DAST manual
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Empaquetar sin volver a ejecutar pruebas
        shell: bash
        run: |
          mkdir -p target
          bash ./mvnw -B -DskipTests package > target/dast-preparacion.log 2>&1
      - name: Publicar diagnóstico de empaquetado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-preparacion-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/dast-preparacion.log
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar aplicación para el escaneo
        uses: actions/upload-artifact@v4
        with:
          name: backend-dast-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1
  escanear:
    name: API Scan activo en H2 y mocks
    needs: preparar
    if: ${{ always() && (needs.preparar.result == 'success' || needs.preparar.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Descargar aplicación ya empaquetada
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('backend-dast-{0}-{1}', github.run_id, github.run_attempt) || inputs.artifact_name }}
          path: target/dast-input
      - name: Arrancar instancia efímera aislada
        id: aplicacion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/zap
          application_jar="$(find target/dast-input -type f -name 'retail-*.jar' ! -name '*.original' | head -n 1)"
          test -n "$application_jar"
          java -jar "$application_jar" \
            --server.address=127.0.0.1 \
            --server.port=8080 \
            --spring.profiles.active=local,mock \
            --retail.integracion.ventas.habilitado=false \
            --retail.integracion.ventas.pickup.modo=memoria \
            --retail.integracion.ventas.pedidos.modo=memoria \
            --spring.jpa.show-sql=false \
            --logging.level.pe.edu.unmsm.fisi.retail=WARN \
            > target/zap/servidor.log 2>&1 &
          application_pid=$!
          printf '%s\n' "$application_pid" > target/zap/aplicacion.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/retail/health > target/zap/health.json; then
              exit 0
            fi
            kill -0 "$application_pid"
            sleep 2
          done
          cat target/zap/servidor.log
          exit 1
      - name: Crear JWT efímero del vendedor de prueba
        id: token_prueba
        shell: bash
        run: |
          token="$(node <<'NODE'
          const { createHmac } = require('node:crypto');
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const issuedAt = Math.floor(Date.now() / 1000);
          const unsignedToken = `${encode({ alg: 'HS256', typ: 'JWT' })}.${encode({ sub: 'bbbbbbbb-0000-0000-0000-000000000001', iat: issuedAt, exp: issuedAt + 600 })}`;
          const signature = createHmac('sha256', 'clave-de-desarrollo-g4-retail-solo-para-la-semana-8').update(unsignedToken).digest('base64url');
          process.stdout.write(`${unsignedToken}.${signature}`);
          NODE
          )"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"
      - name: Verificar OpenAPI y ruta autenticada de prueba
        shell: bash
        env:
          RETAIL_DAST_TOKEN: ${{ steps.token_prueba.outputs.value }}
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8080/v3/api-docs > target/zap/openapi.json
          curl --fail --silent \
            --header "Authorization: Bearer $RETAIL_DAST_TOKEN" \
            http://127.0.0.1:8080/api/v1/retail/perfil > target/zap/preflight-perfil.json
      - name: OWASP ZAP API Scan activo
        id: zap
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.token_prueba.outputs.value }}
          ZAP_AUTH_HEADER_SITE: http://127.0.0.1:8080
        with:
          target: http://127.0.0.1:8080/v3/api-docs
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: .zap/api-scan-rules.tsv
          cmd_options: -I -T 15
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-scan-s14-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Crear resumen y reunir reportes
        if: always()
        shell: bash
        run: |
          set +e
          image_reference="$(docker image inspect ghcr.io/zaproxy/zaproxy:stable --format '{{index .RepoDigests 0}}' 2>/dev/null)"
          node scripts/dast/resumir-zap.mjs \
            --report report_json.json \
            --output target/zap/resumen.md \
            --sha "$GITHUB_SHA" \
            --outcome "${{ steps.zap.outcome }}" \
            --image "$image_reference"
          for report in report_html.html report_json.json report_md.md; do
            if test -f "$report"; then
              cp "$report" target/zap/"$report"
            fi
          done
      - name: Publicar evidencia DAST y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-s14-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/zap/
          if-no-files-found: warn
          retention-days: 30
      - name: Detener instancia efímera
        if: always()
        shell: bash
        run: |
          if test -f target/zap/aplicacion.pid; then
            kill "$(cat target/zap/aplicacion.pid)" 2>/dev/null || true
          fi
