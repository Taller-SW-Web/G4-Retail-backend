name: Evidencias Backend S14
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integracion:
    name: Integración H2 y PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: retail_s14
          POSTGRES_USER: retail_test
          POSTGRES_PASSWORD: solo-ci-efimero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail_test -d retail_s14"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Verificar herramientas de evidencia
        run: node --test scripts/performance/*.test.mjs scripts/dast/*.test.mjs
      - name: Suite completa y paquete (H2)
        run: bash ./mvnw -B clean verify
      - name: Integración seleccionada (H2 y dobles HTTP)
        run: bash ./mvnw -B -Pintegracion-s14 test
      - name: Integración del POS con PostgreSQL efímero
        env:
          S14_DB_URL: jdbc:postgresql://localhost:5432/retail_s14
          S14_DB_USER: retail_test
          S14_DB_PASSWORD: solo-ci-efimero
        run: >-
          bash ./mvnw -B -Dtest=PosDependenciasIntegrationTest
          -Dretail.test.reports=target/postgres-reports test
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-s14-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/integration-reports/
            target/postgres-reports/
            target/*.jar
          if-no-files-found: error
          retention-days: 30
  performance:
    name: Evidencia automática de performance S14
    needs: integracion
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    uses: ./.github/workflows/workflow-performance.yml
    with:
      artifact_name: backend-s14-${{ github.run_id }}-${{ github.run_attempt }}
  dast:
    name: DAST API local OWASP ZAP
    needs: integracion
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    uses: ./.github/workflows/workflow-dast.yml
    with:
      artifact_name: backend-s14-${{ github.run_id }}-${{ github.run_attempt }}
  evidence-gate:
    name: Gate de evidencia por rama
    needs: [integracion, performance, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXTENDED: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
        with:
          script: |
            const n = JSON.parse(process.env.RESULTS);
            const required = process.env.EXTENDED === 'true' ? ['integracion','performance','dast'] : ['integracion'];
            if (required.some(id => n[id]?.result !== 'success')) core.setFailed('Evidencia obligatoria incompleta.');
            await core.summary.addTable([['Control','Resultado'], ...Object.entries(n).map(([k,v])=>[k,v.result])]).write();
