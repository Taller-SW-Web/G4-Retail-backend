# CD del backend: en push a main o ejecucion manual, corre CI y despliega a Railway via CLI.
#
# Configuracion requerida en este repo (Settings > Secrets and variables > Actions):
#   Secret:   RAILWAY_TOKEN    (Project Token de Railway, rlwy_proj_...)
#   Variable: RAILWAY_SERVICE  (nombre del servicio backend en Railway, o como Secret)
name: CD backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1. Primero corre CI (tests + build)
  ci:
    uses: ./.github/workflows/ci.yml

  # 2. Si CI pasa, despliega a Railway
  deploy:
    needs: ci
    uses: Taller-SW-Web/devsecops-templates/.github/workflows/cd-railway.yml@main
    with:
      environment: production
      service: ${{ vars.RAILWAY_SERVICE }}
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
