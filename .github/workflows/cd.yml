# CD del backend: despliegue manual a Railway via CLI + Project Token.
# Se dispara manualmente desde la pestaña Actions > Run workflow.
#
# Configuracion requerida en este repo (Settings > Secrets and variables > Actions):
#   Secret:   RAILWAY_TOKEN    (Project Token de Railway, rlwy_proj_...)
#   Variable: RAILWAY_SERVICE  (nombre del servicio backend en Railway)
name: CD backend

on:
  workflow_dispatch:

jobs:
  # 1. Primero corre CI (tests + build)
  ci:
    uses: ./.github/workflows/ci.yml

  # 2. Si CI pasa, despliega a Railway
  deploy:
    needs: ci
    uses: Taller-SW-Web/devsecops-templates/.github/workflows/cd-railway.yml@main
    with:
      environment: production
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
