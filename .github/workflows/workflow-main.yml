name: Production Deployment and Rollback
run-name: CD | ${{ inputs.rollback && 'Rollback' || 'Deployment' }} | ${{ inputs.release_tag || github.sha }}
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '.github/**'
  workflow_dispatch:
    inputs:
      rollback:
        description: Restore a previously deployed release (retail-operator team required)
        type: boolean
        default: false
      release_tag:
        description: Production tag to restore; required only for rollback
        type: string
        required: false
permissions:
  contents: write
  actions: read
jobs:
  delivery:
    name: Despliegue a producción
    uses: Taller-SW-Web/devsecops-templates/.github/workflows/workflow-deploy.yml@main
    with:
      component_name: ms-retail-backend
      technology: maven
      sonar_host_url: ${{ vars.SONAR_HOST_URL }}
      rollback: ${{ inputs.rollback || false }}
      release_tag: ${{ inputs.release_tag || '' }}
      healthcheck_url: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN_G4: ${{ secrets.GH_TOKEN_G4 }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
