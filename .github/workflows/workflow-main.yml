name: Production Deploy
run-name: CD | ${{ inputs.rollback && 'Rollback' || (github.ref == 'refs/heads/main' && 'Production Release' || 'Develop Verification') }}
'on':
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      rollback:
        description: Restore the production tag selected in Use workflow from (retail-operator team required)
        type: boolean
        default: false
      version_override:
        description: Optional SemVer vX.Y.Z override for release (main only)
        type: string
        default: ''
permissions:
  contents: write
  actions: read
  security-events: write
  pull-requests: write
concurrency:
  group: cd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Security Analysis and Build
    if: ${{ !inputs.rollback }}
    uses: Taller-SW-Web/devsecops-templates/.github/workflows/workflow-pr-analysis.yml@main
    with:
      component_name: ms-retail-backend
      technology: maven
      language: java
      sonar_host_url: ${{ vars.SONAR_HOST_URL }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  integration:
    name: Integration (H2 and PostgreSQL)
    needs: quality
    if: ${{ !inputs.rollback && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: retail_s14
          POSTGRES_USER: retail_test
          POSTGRES_PASSWORD: solo-ci-efimero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail_test -d retail_s14"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: node --test scripts/performance/*.test.mjs scripts/dast/*.test.mjs
      - name: Integration suite (H2 and HTTP doubles)
        run: bash ./mvnw -B -Pintegracion-s14 test
      - name: POS integration with ephemeral PostgreSQL
        env:
          S14_DB_URL: jdbc:postgresql://localhost:5432/retail_s14
          S14_DB_USER: retail_test
          S14_DB_PASSWORD: solo-ci-efimero
        run: >-
          bash ./mvnw -B -Dtest=PosDependenciasIntegrationTest
          -Dretail.test.reports=target/postgres-reports test
      - name: Publish integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ github.run_attempt }}
          path: |
            target/integration-reports/
            target/postgres-reports/
          if-no-files-found: error
          retention-days: 30
  performance:
    name: Performance (POS Load Smoke)
    needs: quality
    if: ${{ !inputs.rollback && github.ref == 'refs/heads/main' && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/download-artifact@v4
        with:
          name: build-coverage-${{ github.run_attempt }}
          path: .
      - name: Boot JAR and run load test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/performance
          application_jar="$(find target -maxdepth 2 -type f -name 'retail-*.jar' ! -name '*.original' | head -n 1)"
          test -n "$application_jar"
          java -jar "$application_jar" \
            --spring.profiles.active=local,mock \
            --retail.seguridad.jwks-uri=http://127.0.0.1:9/jwks \
            --retail.integracion.g7.token-url=http://127.0.0.1:9/token \
            --retail.integracion.ventas.url=http://127.0.0.1:9 \
            --retail.integracion.ventas.habilitado=false \
            --retail.integracion.ventas.pickup.modo=memoria \
            --retail.integracion.ventas.pedidos.modo=memoria \
            --spring.jpa.show-sql=false \
            --logging.level.pe.edu.unmsm.fisi.retail=WARN \
            > target/performance/servidor.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          listo=false
          for intento in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/retail/health >/dev/null; then
              listo=true
              break
            fi
            kill -0 "$app_pid"
            sleep 2
          done
          test "$listo" = true
          node scripts/performance/pos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ github.run_attempt }}
          path: target/performance/
          if-no-files-found: error
          retention-days: 30
  dast:
    name: DAST API Scan (OWASP ZAP)
    needs: quality
    if: ${{ !inputs.rollback && github.ref == 'refs/heads/main' && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/download-artifact@v4
        with:
          name: build-coverage-${{ github.run_attempt }}
          path: .
      - name: Boot ephemeral instance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/zap
          application_jar="$(find target -maxdepth 2 -type f -name 'retail-*.jar' ! -name '*.original' | head -n 1)"
          test -n "$application_jar"
          java -jar "$application_jar" \
            --server.address=127.0.0.1 \
            --server.port=8080 \
            --spring.profiles.active=local,mock \
            --retail.seguridad.jwks-uri=http://127.0.0.1:9/jwks \
            --retail.integracion.g7.token-url=http://127.0.0.1:9/token \
            --retail.integracion.ventas.url=http://127.0.0.1:9 \
            --retail.integracion.ventas.habilitado=false \
            --retail.integracion.ventas.pickup.modo=memoria \
            --retail.integracion.ventas.pedidos.modo=memoria \
            --spring.jpa.show-sql=false \
            --logging.level.pe.edu.unmsm.fisi.retail=WARN \
            > target/zap/servidor.log 2>&1 &
          application_pid=$!
          printf '%s\n' "$application_pid" > target/zap/aplicacion.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/retail/health > target/zap/health.json; then
              exit 0
            fi
            kill -0 "$application_pid"
            sleep 2
          done
          cat target/zap/servidor.log
          exit 1
      - name: Generate ephemeral test JWT
        id: token_prueba
        shell: bash
        run: |
          token="$(node <<'NODE'
          const { createHmac } = require('node:crypto');
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const issuedAt = Math.floor(Date.now() / 1000);
          const unsignedToken = `${encode({ alg: 'HS256', typ: 'JWT' })}.${encode({ sub: 'bbbbbbbb-0000-0000-0000-000000000001', iat: issuedAt, exp: issuedAt + 1800 })}`;
          const signature = createHmac('sha256', 'clave-de-desarrollo-g4-retail-solo-para-la-semana-8').update(unsignedToken).digest('base64url');
          process.stdout.write(`${unsignedToken}.${signature}`);
          NODE
          )"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"
      - name: Preflight OpenAPI and authenticated route
        shell: bash
        env:
          RETAIL_DAST_TOKEN: ${{ steps.token_prueba.outputs.value }}
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8080/v3/api-docs > target/zap/openapi.json
          curl --fail --silent \
            --header "Authorization: Bearer $RETAIL_DAST_TOKEN" \
            http://127.0.0.1:8080/api/v1/retail/perfil > target/zap/preflight-perfil.json
      - name: OWASP ZAP Active API Scan
        id: zap
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.token_prueba.outputs.value }}
          ZAP_AUTH_HEADER_SITE: http://127.0.0.1:8080
        with:
          target: http://127.0.0.1:8080/v3/api-docs
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: .zap/api-scan-rules.tsv
          cmd_options: -I -T 15
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-scan-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize ZAP report
        if: always()
        shell: bash
        run: |
          set +e
          image_reference="$(docker image inspect ghcr.io/zaproxy/zaproxy:stable --format '{{index .RepoDigests 0}}' 2>/dev/null)"
          node scripts/dast/resumir-zap.mjs \
            --report report_json.json \
            --output target/zap/resumen.md \
            --sha "$GITHUB_SHA" \
            --outcome "${{ steps.zap.outcome }}" \
            --image "$image_reference"
          resumen_status=$?
          for report in report_html.html report_json.json report_md.md; do
            if test -f "$report"; then
              cp "$report" target/zap/"$report"
            fi
          done
          exit "$resumen_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-zap-${{ github.run_attempt }}
          path: target/zap/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop ephemeral instance
        if: always()
        shell: bash
        run: |
          if test -f target/zap/aplicacion.pid; then
            kill "$(cat target/zap/aplicacion.pid)" 2>/dev/null || true
          fi
  delivery:
    needs: [quality, integration, performance, dast]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.rollback || (needs.quality.result == 'success' && needs.integration.result == 'success' && needs.performance.result == 'success' && needs.dast.result == 'success')) }}
    name: Production Deploy and SemVer Release
    uses: Taller-SW-Web/devsecops-templates/.github/workflows/workflow-deploy.yml@main
    with:
      component_name: ms-retail-backend
      technology: maven
      sonar_host_url: ${{ vars.SONAR_HOST_URL }}
      rollback: ${{ inputs.rollback || false }}
      skip_quality: true
      version_override: ${{ inputs.version_override || '' }}
      release_tag: ${{ inputs.rollback && github.ref_type == 'tag' && github.ref_name || '' }}
      healthcheck_url: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN_G4: ${{ secrets.GH_TOKEN_G4 }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
