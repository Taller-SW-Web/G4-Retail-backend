name: Production Deploy
run-name: CD | ${{ inputs.rollback && 'Rollback' || 'Deployment' }}
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      rollback:
        description: Restore the production tag selected in Use workflow from (retail-operator team required)
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  delivery:
    name: Continuous Delivery
    uses: Taller-SW-Web/devsecops-templates/.github/workflows/workflow-deploy.yml@main
    with:
      component_name: ms-retail-backend
      technology: maven
      sonar_host_url: ${{ vars.SONAR_HOST_URL }}
      rollback: ${{ inputs.rollback || false }}
      release_tag: ${{ inputs.rollback && github.ref_type == 'tag' && github.ref_name || '' }}
      healthcheck_url: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN_G4: ${{ secrets.GH_TOKEN_G4 }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
