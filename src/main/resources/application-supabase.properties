# ---------------------------------------------------------------------------
# Perfil 'supabase': PostgreSQL real.
# Las credenciales NO se escriben aqui: se leen de variables de entorno, para que
# nunca queden en el historial de Git. Ver la seccion "Configuracion" del README.
# ---------------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'validate' compara las entidades con el esquema real y falla si no coinciden:
# nunca modifica la base de Angie.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
