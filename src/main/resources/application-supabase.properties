# ---------------------------------------------------------------------------
# Perfil 'supabase': PostgreSQL real.
# Las credenciales NO se escriben aqui: se leen de variables de entorno, para que
# nunca queden en el historial de Git. Ver la seccion "Configuracion" del README.
# ---------------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'none' para que no aborte si hay diferencias entre entidades y esquema en Supabase
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.sql.init.mode=never

# Optimizacion de HikariCP para bajo consumo de memoria (Cloud / Railway)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# F7 pickup: en la nube siempre contra Ventas (G5) real. Sin G7_CLIENT_SECRET responde 503,
# nunca pedidos de ejemplo ni constancias ficticias.
retail.integracion.ventas.pickup.modo=${RETAIL_PICKUP_MODO:g5}
# F6 consulta de pedidos: igual que pickup, siempre contra Ventas (G5) real en la nube.
retail.integracion.ventas.pedidos.modo=${RETAIL_PEDIDOS_MODO:g5}

