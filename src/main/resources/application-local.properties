# ---------------------------------------------------------------------------
# Perfil 'local': H2 en memoria. Permite levantar y probar el backend sin
# depender de las credenciales de Supabase. Los datos se pierden al apagar.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:retail;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades y luego se cargan los datos de prueba
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:datos-local.sql

spring.jpa.show-sql=true
spring.h2.console.enabled=true
