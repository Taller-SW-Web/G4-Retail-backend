# ---------------------------------------------------------------------------
# Perfil 'local': H2 en memoria. Permite levantar y probar el backend sin
# depender de las credenciales de Supabase. Los datos se pierden al apagar.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:retail;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades y luego se cargan los datos de prueba
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:datos-local.sql,classpath:db/registro-venta.sql,classpath:db/f12-actas-local.sql

spring.jpa.show-sql=true
spring.h2.console.enabled=true

# API Management (seccion 2.8): en local y en las pruebas automaticas el limite es alto para no
# frenar las suites. Para demostrarlo: RETAIL_LIMITE_PETICIONES_POR_MINUTO=5
retail.api.limite.peticiones-por-minuto=${RETAIL_LIMITE_PETICIONES_POR_MINUTO:100000}
