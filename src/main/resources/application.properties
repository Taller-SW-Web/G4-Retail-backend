# ---------------------------------------------------------------------------
# ms-retail: configuracion comun a todos los entornos
# El perfil decide la base de datos: 'local' usa H2 en memoria y 'supabase', PostgreSQL.
# En la nube se sobrescribe con la variable de entorno SPRING_PROFILES_ACTIVE.
# ---------------------------------------------------------------------------
spring.application.name=ms-retail
# 'mock' activa los dobles de los modulos externos (G5, G6, G7) de la Semana 8.
# Para apuntar a un modulo real, se arranca sin ese perfil: no se toca codigo.
spring.profiles.active=local,mock
server.port=8080

# Origenes autorizados de la SPA (Vite en local; en la nube, el dominio de Vercel)
retail.cors.origenes-permitidos=http://localhost:5173

# Los campos nulos no viajan en el JSON de respuesta
spring.jackson.default-property-inclusion=non_null

# Evita consultas perezosas fuera de la transaccion
spring.jpa.open-in-view=false
