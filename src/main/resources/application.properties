# ---------------------------------------------------------------------------
# ms-retail: configuracion comun a todos los entornos
# El perfil decide la base de datos: 'local' usa H2 en memoria y 'supabase', PostgreSQL.
# En la nube se sobrescribe con la variable de entorno SPRING_PROFILES_ACTIVE.
# ---------------------------------------------------------------------------
spring.application.name=ms-retail
# 'mock' activa los dobles de los modulos externos (G5, G6, G7) de la Semana 8.
# Para apuntar a un modulo real, se arranca sin ese perfil: no se toca codigo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local,mock}
server.port=${PORT:8080}

# Origenes autorizados de la SPA (Vite en local; en la nube, el dominio de Vercel).
# En Render se sobrescribe con la variable de entorno RETAIL_CORS_ORIGENES_PERMITIDOS.
retail.cors.origenes-permitidos=${RETAIL_CORS_ORIGENES_PERMITIDOS:http://localhost:5173}

# Los campos nulos no viajan en el JSON de respuesta
spring.jackson.default-property-inclusion=non_null

# Evita consultas perezosas fuera de la transaccion
spring.jpa.open-in-view=false

# Clave compartida con la que el frontend firma el JWT simulado de la Semana 8.
# SOLO DESARROLLO: al conectar el Seguridad real (G7) se reemplaza el decodificador
# por uno que lea su JWKS y esta clave desaparece.
retail.seguridad.mock.clave=clave-de-desarrollo-g4-retail-solo-para-la-semana-8

# Endpoint JWKS oficial de Seguridad (G7) para validar tokens reales (RS256)
retail.seguridad.jwks-uri=${RETAIL_SEGURIDAD_JWKS_URI:https://g7-auth-service.onrender.com/api/v1/auth/.well-known/jwks.json}

# Integracion con Modulo de Ventas y Postventa (G5)
retail.integracion.ventas.url=${RETAIL_VENTAS_URL:https://g5-servicio-ventas.onrender.com}
retail.integracion.ventas.habilitado=${RETAIL_VENTAS_HABILITADO:true}
retail.integracion.ventas.timeout-ms=${RETAIL_VENTAS_TIMEOUT_MS:3500}
# Pickup F7 contra Ventas (G5): auto = real si hay secreto de G7, si no pedidos de ejemplo en memoria
retail.integracion.ventas.pickup.modo=${RETAIL_PICKUP_MODO:auto}
retail.integracion.ventas.pickup.timeout-ms=${RETAIL_PICKUP_TIMEOUT_MS:20000}
# Token de servicio de Seguridad (G7), flujo client_credentials. El secreto SOLO por variable de entorno.
retail.integracion.g7.token-url=${G7_TOKEN_URL:https://g7-auth-service.onrender.com/api/v1/auth/token}
retail.integracion.g7.client-id=${G7_CLIENT_ID:modulo-retail}
retail.integracion.g7.client-secret=${G7_CLIENT_SECRET:}
retail.integracion.g7.audience-ventas=${G7_AUDIENCE_VENTAS:api-ventas}
# Codigo de tienda que entiende Ventas cuando el perfil local aun guarda la tienda como UUID (D-05)
retail.tienda.codigo-por-defecto=${RETAIL_TIENDA_POR_DEFECTO:TIENDA-MIRAFLORES}

