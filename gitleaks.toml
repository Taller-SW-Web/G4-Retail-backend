# gitleaks.toml — Política de secretos para G4-Retail-backend
# Ref: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
#
# Criterio de exención documentado (SUPER_PROMPT regla 198):
#   - Fixtures de test intencionados: tokens JWT y clave HMAC usados únicamente
#     en pruebas unitarias contra mocks locales, nunca en producción.
#   - Commits históricos donde los JWTs de prueba existieron en SeguridadConfigTest.java
#     antes de migrar a generación dinámica con Nimbus JOSE.

title = "G4-Retail-backend Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Fixtures de test en SeguridadConfigTest.java y commits históricos ya remediados"
condition = "OR"
paths = [
    '''src/test/java/pe/edu/unmsm/fisi/retail/config/SeguridadConfigTest\.java''',
]
commits = [
    "9fe8a9f2604b4ce7e3f923679e2f92c96c5e9df9",
    "95ad83b6024298dabccd2d7458cd0704c2057004",
]
